name: Znlite live image

on:
  push:
    branches:
      - arena/01a0e2b8-znlite
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Check out Znlite
        uses: actions/checkout@v4

      - name: Cache Linux source archive
        uses: actions/cache@v4
        with:
          path: build/dl
          key: znlite-linux-6.12.111-${{ runner.os }}
          restore-keys: znlite-linux-6.12.111-${{ runner.os }}-

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ca-certificates cpio curl debhelper dpkg-dev dwarves fakeroot file flex git grub-common grub-efi-amd64-bin grub-pc-bin initramfs-tools libelf-dev libssl-dev live-build make mtools qemu-system-x86 rsync sudo xorriso

      - name: Check project configuration
        run: ./scripts/check.sh

      - name: Build text-only live image and custom kernel package
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build
          JOBS=2 ./scripts/build.sh 2>&1 | tee build/build.log

      - name: Report failure diagnostics
        if: failure()
        shell: bash
        run: |
          for log_file in build/build.log build/output/qemu-boot.log; do
            if [ -f "$log_file" ]; then
              tail -n 30 "$log_file" | while IFS= read -r line; do
                printf '::error title=Build diagnostic::%s\n' "${line:0:500}"
              done
            fi
          done

      - name: Smoke test BIOS boot in QEMU
        run: ./scripts/smoke-test.sh

      - name: Verify kernel package metadata
        run: |
          test "$(dpkg-deb --field build/output/znlite-kernel-6.12.111-amd64.deb Version)" = "6.12.111-1"
          test "$(dpkg-deb --field build/output/znlite-kernel-6.12.111-amd64.deb Architecture)" = "amd64"
          dpkg-deb --field build/output/znlite-kernel-6.12.111-amd64.deb Package | grep -E '^linux-image-6\.12\.111-znlite$'

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: znlite-x86_64-text-only
          path: |
            build/output/znlite-live-x86_64.iso
            build/output/znlite-kernel-6.12.111-amd64.deb
            build/output/SHA256SUMS
            build/dl/v6.12.111.tar.gz
            build/dl/v6.12.111.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30
