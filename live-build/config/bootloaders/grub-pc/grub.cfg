source /boot/grub/config.cfg
set default=0
set timeout=5

menuentry 'Znlite Aurora - vector console' {
    linux @KERNEL_LIVE@ @APPEND_LIVE@
    initrd @INITRD_LIVE@
}
menuentry 'Znlite Aurora - raster rescue' {
    linux @KERNEL_LIVE@ @APPEND_LIVE@ znlite.console=raster
    initrd @INITRD_LIVE@
}
menuentry 'Znlite Aurora - safe mode' {
    linux @KERNEL_LIVE@ @APPEND_LIVE@ znlite.console=raster nomodeset
    initrd @INITRD_LIVE@
}
if @ENABLE_INSTALL_MENU@; then
    source /boot/grub/install_start.cfg
    submenu 'Advanced install options' {
        source /boot/grub/theme.cfg
        source /boot/grub/install.cfg
    }
fi
if [ "${grub_platform}" = "efi" ]; then
    menuentry 'UEFI firmware settings' {
        fwsetup
    }
fi
