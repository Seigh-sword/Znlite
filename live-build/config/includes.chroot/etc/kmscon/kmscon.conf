# Scalable TrueType outlines, rasterized at the selected pixel size by FreeType.
font-engine=freetype
font-name=DejaVu Sans Mono
font-size=18
term=xterm-256color
# Software rendering is friendlier to older Intel laptops; no desktop required.
no-hwaccel
palette=custom
palette-background=8,15,24
palette-foreground=219,244,247
palette-black=8,15,24
palette-red=255,116,139
palette-green=120,231,184
palette-yellow=246,211,133
palette-blue=72,167,227
palette-magenta=181,157,236
palette-cyan=105,235,232
palette-light-grey=219,244,247
palette-dark-grey=88,112,132
palette-light-red=255,161,170
palette-light-green=168,247,212
palette-light-yellow=255,232,180
palette-light-blue=135,204,255
palette-light-magenta=211,194,255
palette-light-cyan=190,243,247
palette-white=235,253,255
